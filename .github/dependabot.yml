version: 2

# A plain "chore" prefix without include: scope gives titles like
# "chore: bump x from 1 to 2", which match the commit message convention
updates:
  - package-ecosystem: gomod
    directories: [/, /tools/gitleaksgen]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go-modules:
        patterns: ['*']
    ignore:
      # Test-only, with no semver tags: Dependabot resolves "latest" to the
      # parent repo's v2.1.0-rc.5+incompatible tag, which lacks the package,
      # and the whole group update fails. Bump the pseudo-version by hand
      - dependency-name: github.com/pingcap/tidb/pkg/parser

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']
