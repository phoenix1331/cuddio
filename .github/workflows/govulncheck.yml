name: govulncheck

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # New advisories appear without any push, so check weekly too
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27.x'
          go-package: ./...
