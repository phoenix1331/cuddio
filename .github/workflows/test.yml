name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The latest two Go releases; go.mod's go line is the older one
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          install-only: true

      # gofmt, go vet, golangci-lint, race tests and the 90% coverage gate
      - run: sh scripts/check.sh

  archives:
    name: release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      # Module zips ignore export-ignore, so what go install downloads is kept small instead
      - run: sh .github/scripts/check-module-size.sh

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean

      - run: sh .github/scripts/check-archives.sh
