version: 2

project_name: cuddio

builds:
  - id: cuddio
    main: ./cmd/cuddio
    binary: cuddio
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: cuddio
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # Only the binary, LICENSE and README.md ship; .github/scripts/check-archives.sh enforces it
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  disable: true

# Snapshot builds only until the release workflow, Homebrew tap and Scoop bucket are set up
release:
  disable: true
