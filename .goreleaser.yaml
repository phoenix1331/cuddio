version: 2

project_name: cuddio

builds:
  - id: cuddio
    main: .
    binary: cuddio
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: cuddio
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # Only the binary, LICENSE and README.md ship; .github/scripts/check-archives.sh enforces it
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  disable: true

release:
  github:
    owner: phoenix1331
    name: cuddio
  name_template: '{{ .Tag }}'

# The tap and bucket are separate repositories, so GITHUB_TOKEN cannot write
# to them; TAP_GITHUB_TOKEN is a fine-grained token with contents write on both
homebrew_casks:
  - name: cuddio
    repository:
      owner: phoenix1331
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: https://phoenix1331.github.io/cuddio
    description: Hide secrets and PII in logs, SQL dumps and text before you paste them into AI tools
    license: MIT
    commit_author:
      name: phoenix1331
      email: darren@phoenix1331.co.uk
    commit_msg_template: 'chore: update cuddio to {{ .Tag }}'
    generate_completions_from_executable:
      executable: cuddio
      args: [completion]
      shell_parameter_format: cobra
    # The binary is not notarised, so macOS would quarantine it
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/cuddio"]
          end

scoops:
  - name: cuddio
    repository:
      owner: phoenix1331
      name: scoop-bucket
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    homepage: https://phoenix1331.github.io/cuddio
    description: Hide secrets and PII in logs, SQL dumps and text before you paste them into AI tools
    license: MIT
    commit_author:
      name: phoenix1331
      email: darren@phoenix1331.co.uk
    commit_msg_template: 'chore: update cuddio to {{ .Tag }}'
